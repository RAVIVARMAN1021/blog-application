<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Your Account – Blogverse</title>
  <meta name="description" content="Join Blogverse today to publish articles, read stories, and connect with other creators." />
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo" aria-label="Blogverse Home">
        <img src="assets/images/logo.svg" alt="Blogverse Logo" />
        <span>Blog<span class="brand-accent">verse</span></span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="index.html#latest-posts" class="nav-link">Articles</a>
        <a href="create-blog.html" class="nav-link">Write</a>
      </nav>

      <div class="nav-actions">
        <button class="theme-toggle-btn" aria-label="Toggle Theme" title="Toggle theme">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <a href="login.html" class="btn btn-sm btn-outline">Sign In</a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="auth-logo">
            <img src="assets/images/logo.svg" alt="Blogverse Logo" width="48" height="48" />
          </a>
          <h1 class="auth-title">Join Blogverse</h1>
          <p class="auth-subtitle">Create your free author account to start sharing your stories</p>
        </div>

        <!-- Registration Form -->
        <form class="auth-form" id="register-form" novalidate>
          <!-- Full Name Field -->
          <div class="form-group">
            <label for="reg-name" class="form-label">Full Name</label>
            <div class="form-input-wrap">
              <svg class="input-icon-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <input
                type="text"
                id="reg-name"
                class="form-control has-left-icon"
                placeholder="e.g. John Doe"
                autocomplete="name"
                required
              />
            </div>
            <div class="form-error-msg" id="reg-name-error"></div>
          </div>

          <!-- Email Address Field -->
          <div class="form-group">
            <label for="reg-email" class="form-label">Email Address</label>
            <div class="form-input-wrap">
              <svg class="input-icon-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              <input
                type="email"
                id="reg-email"
                class="form-control has-left-icon"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </div>
            <div class="form-error-msg" id="reg-email-error"></div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="reg-password" class="form-label">Password</label>
            <div class="form-input-wrap">
              <svg class="input-icon-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <input
                type="password"
                id="reg-password"
                class="form-control has-left-icon has-right-icon"
                placeholder="At least 6 characters"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="password-toggle-btn"
                data-target="reg-password"
                aria-label="Toggle password visibility"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <!-- Password strength indicator -->
            <div class="password-strength-bar">
              <div class="password-strength-progress" id="password-strength-bar"></div>
            </div>
            <div class="form-error-msg" id="reg-password-error"></div>
          </div>

          <!-- Confirm Password Field -->
          <div class="form-group">
            <label for="reg-confirm-password" class="form-label">Confirm Password</label>
            <div class="form-input-wrap">
              <svg class="input-icon-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
              <input
                type="password"
                id="reg-confirm-password"
                class="form-control has-left-icon has-right-icon"
                placeholder="Re-enter your password"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="password-toggle-btn"
                data-target="reg-confirm-password"
                aria-label="Toggle confirm password visibility"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <div class="form-error-msg" id="reg-confirm-error"></div>
          </div>

          <!-- Terms Agreement Checkbox -->
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="reg-terms" required checked />
              <span>I agree to the <a href="#" class="auth-link">Terms of Service</a> and <a href="#" class="auth-link">Privacy Policy</a></span>
            </label>
            <div class="form-error-msg" id="reg-terms-error"></div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary btn-full btn-lg">
            Create Free Account
          </button>
        </form>

        <div class="auth-footer">
          Already have an account?
          <a href="login.html" class="auth-link">Sign in here</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/blog.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Redirect if already authenticated
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof redirectIfAuth === 'function') {
        redirectIfAuth();
      }
    });
  </script>
</body>
</html>
