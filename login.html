<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – Blogverse</title>
  <meta name="description" content="Sign in to your Blogverse account to create, manage, and publish your stories." />
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo" aria-label="Blogverse Home">
        <img src="assets/images/logo.svg" alt="Blogverse Logo" />
        <span>Blog<span class="brand-accent">verse</span></span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="index.html#latest-posts" class="nav-link">Articles</a>
        <a href="create-blog.html" class="nav-link">Write</a>
      </nav>

      <div class="nav-actions">
        <button class="theme-toggle-btn" aria-label="Toggle Theme" title="Toggle theme">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <a href="register.html" class="btn btn-sm btn-outline">Create Account</a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="auth-logo">
            <img src="assets/images/logo.svg" alt="Blogverse Logo" width="48" height="48" />
          </a>
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Sign in to your account to continue writing and managing your posts</p>
        </div>

        <!-- Quick Demo Account Fill Box -->
        <div class="demo-credentials-box">
          <div class="demo-info">
            <strong style="color: var(--text-main);">Demo Account:</strong>
            <code>demo@example.com / password123</code>
          </div>
          <button type="button" class="btn btn-sm btn-secondary" id="fill-demo-btn">
            Auto-fill Demo
          </button>
        </div>

        <!-- Login Form -->
        <form class="auth-form" id="login-form" novalidate>
          <!-- Email Field -->
          <div class="form-group">
            <label for="login-email" class="form-label">Email Address</label>
            <div class="form-input-wrap">
              <svg class="input-icon-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              <input
                type="email"
                id="login-email"
                class="form-control has-left-icon"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </div>
            <div class="form-error-msg" id="login-email-error"></div>
          </div>

          <!-- Password Field with Show/Hide Toggle -->
          <div class="form-group">
            <div class="form-label">
              <span>Password</span>
              <a href="#" class="auth-link" style="font-size: 0.8rem;" onclick="alert('For demo purposes, you can use password123 or register a new account.'); return false;">Forgot password?</a>
            </div>
            <div class="form-input-wrap">
              <svg class="input-icon-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <input
                type="password"
                id="login-password"
                class="form-control has-left-icon has-right-icon"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="password-toggle-btn"
                data-target="login-password"
                aria-label="Toggle password visibility"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <div class="form-error-msg" id="login-password-error"></div>
          </div>

          <!-- Options: Remember Me -->
          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="remember-me" checked />
              <span>Remember me for 30 days</span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary btn-full btn-lg">
            Sign In to Account
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account yet?
          <a href="register.html" class="auth-link">Create an account</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/blog.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Redirect if already authenticated
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof redirectIfAuth === 'function') {
        redirectIfAuth();
      }
    });
  </script>
</body>
</html>
